{{- if .Values.admin.enabled }}
{{- if not .Values.persistence.enabled }}
{{- fail "admin.enabled requires persistence.enabled: the admin has nowhere to write" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "itineris.adminLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: moments.json has exactly one writer, and two
    # admin pods overlapping could interleave writes.
    type: Recreate
  selector:
    matchLabels:
      {{- include "itineris.adminSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "itineris.adminSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: admin
          image: {{ include "itineris.adminImage" . | quote }}
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: ITINERIS_PORT
              value: {{ .Values.admin.containerPort | quote }}
            - name: ITINERIS_DATA_DIR
              value: /srv/itineris
            {{- if .Values.admin.allowedEmails }}
            - name: ITINERIS_ADMIN_EMAILS
              value: {{ .Values.admin.allowedEmails | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.admin.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /admin/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /admin/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /srv/itineris
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "itineris.claimName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
