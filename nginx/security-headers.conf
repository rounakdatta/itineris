# Included by every location that declares its own add_header, because nginx
# drops ALL inherited add_header directives the moment a block sets one of its
# own -- a server-level header silently vanishes from any location that also
# sets Cache-Control.
#
# No Content-Security-Policy yet: MapLibre needs blob: workers, inline styles
# and the basemap host allow-listed, and a wrong CSP is a blank map. Add it
# once it can be verified in a real browser against the deployed site.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
