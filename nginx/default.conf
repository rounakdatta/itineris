# Runs inside nginxinc/nginx-unprivileged, whose main nginx.conf already points
# the pid file and every *_temp_path at /tmp. This file only owns the server.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The MapLibre chunk is ~1 MB raw and ~280 KB gzipped; on a phone this is
    # the difference between the map appearing and the viewer giving up.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets/, so it can be cached forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Trip data and media change whenever the trip does, and they are NOT
    # fingerprinted: cache briefly and revalidate.
    location ~ ^/(data|media)/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else is the app shell. no-cache means a deploy is picked up on
    # the very next load, while the fingerprinted assets it points at stay
    # cached. The /index.html fallback is what makes client-side routes work.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
